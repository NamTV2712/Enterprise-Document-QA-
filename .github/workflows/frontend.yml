name: Frontend CI

on:
  push:
    paths:
      - ".github/workflows/frontend.yml"
      - "frontend/**"
      - "src/**"
      - "tests/integration/**"
      - "requirements.txt"
      - "Dockerfile"
  pull_request:
    paths:
      - ".github/workflows/frontend.yml"
      - "frontend/**"
      - "src/**"
      - "tests/integration/**"
      - "requirements.txt"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      # Baked into the production bundle so Playwright route fixtures and the
      # built app agree on the mocked API origin.
      VITE_API_BASE_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox

      - name: Token contrast gate
        run: bun e2e/token-contrast.mjs

      - name: Run browser tests
        run: bunx playwright test

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14

      - name: Upload screenshot matrix
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshot-matrix
          path: frontend/e2e/screenshots/
          retention-days: 14

  http-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend harness dependencies
        run: python -m pip install -r requirements.txt

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium firefox

      - name: Run real HTTP/SSE integration suite
        working-directory: frontend
        run: bun run test:e2e-integration

      - name: Upload HTTP/SSE integration artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-http-integration-failure-artifacts
          path: |
            frontend/test-results/integration/
            frontend/playwright-report/
          retention-days: 14
