name: Frontend CI

on:
  push:
    paths:
      - ".github/workflows/frontend.yml"
      - "frontend/**"
  pull_request:
    paths:
      - ".github/workflows/frontend.yml"
      - "frontend/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
