services:
  rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEY2=${GROQ_API_KEY2}
      - GROQ_API_KEY3=${GROQ_API_KEY3}
      - GROQ_API_KEY_FALL_BACK=${GROQ_API_KEY_FALL_BACK}
      - GROQ_API_KEY_FALL_BACK2=${GROQ_API_KEY_FALL_BACK2}
      - QDRANT_MODE=local
      - QDRANT_LOCAL_PATH=/app/data/processed/qdrant
      - EMBEDDING_MODEL_REVISION=${EMBEDDING_MODEL_REVISION}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - ENABLE_CACHE_CLEAR=false
    volumes:
      - ./data/processed:/app/data/processed
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/ready').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
