services:
  rag-api:
    build:
      context: .
      args:
        EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-nomic-ai/nomic-embed-text-v1.5}
        EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-e9b6763023c676ca8431644204f50c2b100d9aab}
        RERANKER_MODEL: ${RERANKER_MODEL_ID:-cross-encoder/ms-marco-MiniLM-L-6-v2}
        RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-233902d25c440f23af6f7d6e94d2946bac0bee0a}
        GIT_REVISION: ${GIT_REVISION:-unknown}
    image: edqa-api:${GIT_REVISION:-local}
    ports:
      - "${RELEASE_PORT:-8000}:8000"
    environment:
      # Serving key pool: primary pair plus failover keys 3, 4, 5. The
      # evaluation-generation pool keys are intentionally NOT forwarded:
      # serving never uses them.
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEY2=${GROQ_API_KEY2}
      - GROQ_API_KEY3=${GROQ_API_KEY3}
      - GROQ_API_KEY4=${GROQ_API_KEY4:-}
      - GROQ_API_KEY5=${GROQ_API_KEY5:-}
      - QDRANT_MODE=local
      - QDRANT_LOCAL_PATH=/app/data/processed/qdrant
      - QDRANT_INDEX_MANIFEST_PATH=${QDRANT_INDEX_MANIFEST_PATH:-data/processed/qdrant_index_manifest.json}
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID:-nomic-ai/nomic-embed-text-v1.5}
      - EMBEDDING_MODEL_REVISION=${EMBEDDING_MODEL_REVISION:-e9b6763023c676ca8431644204f50c2b100d9aab}
      - RERANKER_MODEL_ID=${RERANKER_MODEL_ID:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - RERANKER_MODEL_REVISION=${RERANKER_MODEL_REVISION:-233902d25c440f23af6f7d6e94d2946bac0bee0a}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - LLM_RATE_LIMIT_BURST=${LLM_RATE_LIMIT_BURST:-10/minute}
      - LLM_RATE_LIMIT_DAILY=${LLM_RATE_LIMIT_DAILY:-100/day}
      - DECOMPOSED_RATE_LIMIT=${DECOMPOSED_RATE_LIMIT:-5/minute}
      - CACHE_TEST_RATE_LIMIT=${CACHE_TEST_RATE_LIMIT:-10/minute}
      - ENABLE_CACHE_CLEAR=false
      - ENABLE_METRICS_ENDPOINT=false
      - GIT_REVISION=${GIT_REVISION:-unknown}
    volumes:
      - ./data/processed:/app/data/processed
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/ready').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
